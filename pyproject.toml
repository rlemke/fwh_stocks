[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stocks"
version = "0.1.0"
description = "Facetwork domain: stock-group paper-trading tracker (factor + analyst + LLM selection, daily P/L snapshots vs a benchmark)"
requires-python = ">=3.11"
authors = [{name = "Ralph Lemke"}]
dependencies = ["requests"]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2.40"]

[project.entry-points."facetwork.domains"]
stocks = "stocks:domain"

[tool.setuptools.packages.find]
where = ["src"]

# Match the framework repo's settings so formatting does not differ gratuitously
# between a domain and the platform it plugs into.
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501",  # line too long (handled by the formatter)
    "B008",  # function calls in argument defaults
    "B905",  # zip without strict=
]

[tool.setuptools.package-data]
stocks = ["ffl/*.ffl"]
